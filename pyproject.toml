[project]
name = "redream-safety-layer"
version = "1.0.0"
description = "Neuro-symbolic safety layer for an LLM-assisted imagery rehearsal therapy chatbot, with the evaluation data and statistics scripts of the thesis"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "python-dotenv==1.0.0",
    "openai>=1.50.0",
    "groq==0.4.2",
    "langfuse==2.60.0",
    "tiktoken==0.6.0",
    "pydantic>=2.12.0",
    "aiohttp>=3.13.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40.0"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["AI", "safety", "experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
